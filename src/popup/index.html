<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamRead</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <h1>DreamRead</h1>
        <p id="subtitle">划词朗读</p>
      </header>

      <button id="readSelection" class="primary-action" type="button">
        <span aria-hidden="true">▶</span>
        <span id="readSelectionLabel">朗读选中内容</span>
      </button>

      <label>
        <span id="label-engine">TTS 引擎</span>
        <select id="engine">
          <option value="web-speech">Web Speech</option>
          <option value="http">HTTP / ChatTTS</option>
          <option value="azure">Azure Speech</option>
        </select>
      </label>

      <label>
        <span id="label-speech-language">朗读语言</span>
        <select id="speechLanguage">
          <option value="auto">自动检测</option>
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
      </label>

      <label>
        <span id="label-voice-zh">中文音色</span>
        <select id="voiceZh"></select>
      </label>

      <label>
        <span id="label-voice-en">英文音色</span>
        <select id="voiceEn"></select>
      </label>

      <p class="hint" id="voiceHint">★ 标记为推荐自然音色</p>

      <label>
        <span id="label-rate">语速</span>
        <input id="rate" type="range" min="0.5" max="2" step="0.1" />
        <output id="rateValue">1.0x</output>
      </label>

      <label>
        <span id="label-volume">音量</span>
        <input id="volume" type="range" min="0" max="1" step="0.05" />
      </label>

      <label>
        <span id="label-language">界面语言</span>
        <select id="language">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
      </label>

      <p class="hint" id="shortcutHint">快捷键 Alt+R 朗读选区</p>

      <div class="actions">
        <button id="openOptions" type="button">高级设置</button>
        <button id="testVoice" type="button">试听</button>
      </div>

      <p class="status" id="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
